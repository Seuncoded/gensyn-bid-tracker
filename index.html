<!DOCTYPE html>
<html>
<head>

  <meta charset="UTF-8" />

    body {

.container {

  margin: 40px auto;
}

h1 {

}

.stats {

table {
  width: 100%;

}

}

</head>
<body>

 <div class="container">

        <th>Amount</th>
