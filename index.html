<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gensyn Cancel Bid Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg-main: #0c0704;
      --bg-surface: #140c08;
      --bg-panel: #1a100a;
      --bg-hover: #22150e;

      --border: #2b1c13;

      --text-main: #f4efe9;
      --text-muted: #b7a89a;

      --gold: #d6b36a;
      --gold-soft: rgba(214, 179, 106, 0.15);
      --link: #e2c98c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at top, #2a160b 0%, var(--bg-main) 55%);
      color: var(--text-main);
    }

    .container {
      max-width: 1150px;
      margin: 70px auto;
      padding: 0 24px;
    }

    /* ===== Header ===== */
    .header {
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 36px;
      font-weight: 500;
      margin: 0;
      letter-spacing: 0.3px;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* ===== Stats ===== */
    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 36px;
    }

    .stat-card {
      background: linear-gradient(180deg, var(--bg-panel), var(--bg-surface));
      border: 1px solid var(--border);
      padding: 22px 24px;
    }

    .stat-label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    .stat-value {
      margin-top: 10px;
      font-size: 34px;
      font-weight: 500;
      color: var(--gold);
    }

    /* ===== Table Panel ===== */
    .table-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: #120905;
    }

    th {
      padding: 16px;
      text-align: left;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 15px 16px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
    }

    tbody tr:hover {
      background: var(--bg-hover);
    }

    td.wallet {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      color: #e8e1d8;
    }

    td.amount {
      color: var(--gold);
      font-weight: 500;
    }

    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* ===== Responsive ===== */
    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      th:nth-child(4),
      td:nth-child(4) {
        display: none;
      }
    }

    .stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-bottom: 36px;
}

@media (max-width: 900px) {
  .stats {
    grid-template-columns: 1fr;
  }
}

/* ===== Mobile Cards ===== */
@media (max-width: 700px) {
  table thead {
    display: none;
  }

  .mobile-row td {
    padding: 0;
    border: none;
  }

  .mobile-card {
    background: linear-gradient(180deg, var(--bg-panel), var(--bg-surface));
    border-bottom: 1px solid var(--border);
    padding: 16px;
  }

  .mobile-wallet {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    color: var(--text-main);
    word-break: break-all;
    margin-bottom: 10px;
  }

  .mobile-meta {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .mobile-meta .amount {
    color: var(--gold);
    font-weight: 500;
  }

  .mobile-meta .time {
    font-size: 12px;
    color: var(--text-muted);
  }

  .mobile-card a {
    font-size: 13px;
    color: var(--link);
  }
}

/* ===== Enhanced Mobile Cards ===== */
@media (max-width: 700px) {

  .table-panel {
    border: none;
    background: transparent;
  }

  .mobile-row td {
    padding: 0;
    border: none;
  }

  .mobile-card {
    background: linear-gradient(
      180deg,
      rgba(26,16,10,0.95),
      rgba(20,12,8,0.95)
    );
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow:
      0 8px 24px rgba(0,0,0,0.35),
      inset 0 0 0 1px rgba(255,255,255,0.02);
  }

  .mobile-wallet {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    color: var(--text-muted);
    word-break: break-all;
    margin-bottom: 14px;
  }

  .mobile-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .mobile-meta .amount {
    font-size: 20px;
    font-weight: 600;
    color: var(--gold);
  }

  .mobile-meta .token {
    margin-left: 8px;
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 999px;
    background: var(--gold-soft);
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }

  .mobile-meta .time {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .mobile-card a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--link);
    margin-top: 6px;
  }

  .mobile-card a::after {
    content: "→";
    transition: transform 0.15s ease;
  }

  .mobile-card a:hover::after {
    transform: translateX(3px);
  }
}

/* ===== Floating Footer Credit ===== */
.floating-footer {
  position: fixed;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 999;

  background: rgba(20, 12, 8, 0.85);
  backdrop-filter: blur(8px);
  border: 1px solid var(--border);
  border-radius: 999px;

  padding: 8px 14px;
  font-size: 12px;
  color: var(--text-muted);

  display: flex;
  align-items: center;
  gap: 6px;

  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
}

.floating-footer a {
  color: var(--gold);
  font-weight: 500;
  text-decoration: none;
}

.floating-footer a:hover {
  text-decoration: underline;
}

/* ===== Title Styling ===== */
.title {
  font-size: 38px;
  font-weight: 500;
  margin: 0;
  line-height: 1.15;
  letter-spacing: 0.3px;
}

.title .brand {
  display: block;
  font-weight: 600;
  background: linear-gradient(
    180deg,
    #f3d58a,
    #caa24e
  );
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;

  text-shadow: 0 0 18px rgba(214, 179, 106, 0.25);
}

.title .rest {
  display: block;
  color: var(--text-main);
  margin-top: 4px;
}

/* ===== Mobile Title Refinement ===== */
@media (max-width: 700px) {
  .title {
    font-size: 30px;
  }

  .title .brand {
    font-size: 32px;
  }

  .title .rest {
    font-size: 22px;
    color: var(--text-muted);
  }
}

/* ===== Centered Header ===== */
.header.centered {
  text-align: center;
  margin-bottom: 48px;
}

/* ===== Title Styling ===== */
.title {
  margin: 0;
  line-height: 1.1;
}

.title .brand {
  display: block;
  font-size: 44px;
  font-weight: 700;
  letter-spacing: 1.5px;

  background: linear-gradient(180deg, #f6dda0, #caa24e);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;

  text-shadow:
    0 0 18px rgba(214, 179, 106, 0.35),
    0 0 40px rgba(214, 179, 106, 0.15);
}

.title .rest {
  display: block;
  margin-top: 6px;
  font-size: 22px;
  font-weight: 500;
  color: var(--text-muted);
  letter-spacing: 0.6px;
}

/* ===== Subtitle ===== */
.subtitle {
  margin-top: 14px;
  font-size: 14px;
  color: var(--text-muted);
}

/* ===== Mobile Refinement ===== */
@media (max-width: 700px) {
  .title .brand {
    font-size: 38px;
    letter-spacing: 1.2px;
  }

  .title .rest {
    font-size: 20px;
  }

  .subtitle {
    font-size: 13px;
  }
}


  </style>
</head>

<body>
  <div class="container">

   <header class="header centered">
  <h1 class="title">
    <span class="brand">GENSYN</span>
    <span class="rest">Cancel Bid Tracker</span>
  </h1>
  <p class="subtitle">
    On-chain transparency into cancelled bids on Gensyn
  </p>
</header>



   <section class="stats">
  <div class="stat-card">
    <span class="stat-label">Cancelled Bids</span>
    <span class="stat-value" id="totalBids">—</span>
  </div>

  <div class="stat-card">
    <span class="stat-label">Unique Wallets</span>
    <span class="stat-value" id="uniqueWallets">—</span>
  </div>

  <div class="stat-card">
    <span class="stat-label">Total Cancelled Amount</span>
    <span class="stat-value" id="totalAmount">—</span>
  </div>
</section>


    <section class="table-panel">
      <table>
        <thead>
          <tr>
            <th>Wallet</th>
            <th>Amount</th>
            <th>Token</th>
            <th>Time</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>

  </div>

  <script src="script.js"></script>

  <footer class="floating-footer">
  Built by
  <a href="https://x.com/seuncoded" target="_blank" rel="noopener">
    @seuncoded
  </a>
</footer>

</body>
</html>
