<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gensyn Cancel Bid Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg-main: #0c0704;
      --bg-surface: #140c08;
      --bg-panel: #1a100a;
      --bg-hover: #22150e;

      --border: #2b1c13;

      --text-main: #f4efe9;
      --text-muted: #b7a89a;

      --gold: #d6b36a;
      --gold-soft: rgba(214, 179, 106, 0.15);
      --link: #e2c98c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at top, #2a160b 0%, var(--bg-main) 55%);
      color: var(--text-main);
    }

    .container {
      max-width: 1150px;
      margin: 70px auto;
      padding: 0 24px;
    }

    /* ===== Header ===== */
    .header {
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 36px;
      font-weight: 500;
      margin: 0;
      letter-spacing: 0.3px;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* ===== Stats ===== */
    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 36px;
    }

    .stat-card {
      background: linear-gradient(180deg, var(--bg-panel), var(--bg-surface));
      border: 1px solid var(--border);
      padding: 22px 24px;
    }

    .stat-label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    .stat-value {
      margin-top: 10px;
      font-size: 34px;
      font-weight: 500;
      color: var(--gold);
    }

    /* ===== Table Panel ===== */
    .table-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: #120905;
    }

    th {
      padding: 16px;
      text-align: left;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 15px 16px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
    }

    tbody tr:hover {
      background: var(--bg-hover);
    }

    td.wallet {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      color: #e8e1d8;
    }

    td.amount {
      color: var(--gold);
      font-weight: 500;
    }

    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* ===== Responsive ===== */
    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      th:nth-child(4),
      td:nth-child(4) {
        display: none;
      }
    }

    .stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-bottom: 36px;
}

@media (max-width: 900px) {
  .stats {
    grid-template-columns: 1fr;
  }
}

  </style>
</head>

<body>
  <div class="container">

    <header class="header">
      <h1>Gensyn Cancel Bid Tracker</h1>
      <p class="subtitle">
        On-chain transparency into cancelled bids on Gensyn
      </p>
    </header>

   <section class="stats">
  <div class="stat-card">
    <span class="stat-label">Cancelled Bids</span>
    <span class="stat-value" id="totalBids">—</span>
  </div>

  <div class="stat-card">
    <span class="stat-label">Unique Wallets</span>
    <span class="stat-value" id="uniqueWallets">—</span>
  </div>

  <div class="stat-card">
    <span class="stat-label">Total Cancelled Amount</span>
    <span class="stat-value" id="totalAmount">—</span>
  </div>
</section>


    <section class="table-panel">
      <table>
        <thead>
          <tr>
            <th>Wallet</th>
            <th>Amount</th>
            <th>Token</th>
            <th>Time</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
