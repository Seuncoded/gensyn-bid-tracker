<!DOCTYPE html>
<html>
<head>
  <title>Cancel Bid Tracker</title>
  <meta charset="UTF-8" />
  <style>
   * {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: radial-gradient(
    circle at top,
    #1a130d 0%,
    var(--bg-main) 60%
  );
  color: var(--text-primary);
  font-family: Inter, system-ui, -apple-system, sans-serif;
  letter-spacing: 0.2px;
}

.container {
  max-width: 1100px;
  margin: 60px auto;
  padding: 0 20px;
}

/* Header */
.header {
  margin-bottom: 32px;
}

.header h1 {
  font-size: 34px;
  font-weight: 500;
  margin: 0;
  color: var(--text-primary);
}

.subtitle {
  margin-top: 6px;
  font-size: 14px;
  color: var(--text-secondary);
}

/* Stats */
.stats {
  display: flex;
  gap: 16px;
  margin-bottom: 28px;
}

.stat-card {
  flex: 1;
  background: linear-gradient(
    180deg,
    var(--bg-surface),
    #120e0b
  );
  border: 1px solid var(--border-subtle);
  padding: 18px 20px;
}

.stat-label {
  display: block;
  font-size: 12px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.stat-value {
  margin-top: 6px;
  display: block;
  font-size: 28px;
  color: var(--accent-gold);
}

/* Table */
.table-wrap {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead {
  background: #120e0b;
}

th {
  text-align: left;
  padding: 14px 16px;
  font-size: 12px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-secondary);
  border-bottom: 1px solid var(--border-subtle);
}

td {
  padding: 14px 16px;
  font-size: 14px;
  border-bottom: 1px solid var(--border-subtle);
}

tr:hover {
  background: var(--bg-hover);
}

/* Wallet monospace */
td:first-child {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 13px;
}

/* Links */
a {
  color: var(--link);
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

  </style>
</head>
<body>

 <div class="container">

  <header class="header">
    <h1>Cancel Bid Tracker</h1>
    <p class="subtitle">
      On-chain visibility into cancelled bids
    </p>
  </header>

  <section class="stats">
    <div class="stat-card">
      <span class="stat-label">Cancelled bids</span>
      <span class="stat-value" id="totalBids">—</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Unique wallets</span>
      <span class="stat-value" id="uniqueWallets">—</span>
    </div>
  </section>

  <section class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Wallet</th>
          <th>Amount</th>
          <th>Token</th>
          <th>Time</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

</div>



  <script src="script.js"></script>
</body>
</html>
